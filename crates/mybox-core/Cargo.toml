[package]
name = "mybox-core"
version = "0.1.0"
edition = "2021"
description = "mybox framework core: Module trait, event bus, window/hotkey/tray/config services, renderer abstraction"

[dependencies]
winit = { workspace = true }
tiny-skia = { workspace = true }
softbuffer = { workspace = true }
global-hotkey = { workspace = true }
tray-icon = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Phase 3 (D-01): egui lives in core and is re-exported so every module reuses
# ONE egui/egui-winit pair; fuzzy-matcher + pollster serve the palette's filter
# and the async command runner (D-07) respectively.
egui = { workspace = true }
egui-winit = { workspace = true }
fuzzy-matcher = { workspace = true }
pollster = { workspace = true }

# macOS: raise capture-overlay windows above the menu bar + Dock (see
# `window::elevate_overlay_window`). Version pinned to the same objc2 line
# winit 0.30 links against so the NSView/NSWindow classes match winit's.
[target.'cfg(target_os = "macos")'.dependencies]
# "objc2-quartz-core" feature gates NSView::layer() (needed by
# `window::round_floating_corners`).
objc2-app-kit = { version = "0.2.2", features = ["NSView", "NSWindow", "objc2-quartz-core"] }
# C6: NSWindow contentView layer corner rounding (see
# `window::round_floating_corners`). MUST stay on the 0.2.2 line — CALayer has
# to be the same objc2 version as the NSView it comes from or the ObjC class
# caches mismatch (the same discipline as elevate_overlay_window's lock note).
objc2-quartz-core = { version = "0.2.2", features = ["CALayer"] }

# Note: the #[ignore] display/integration tests (tests/integration.rs) and the
# display_checks bin (src/bin/display_checks.rs) use winit + tiny-skia, which
# are already regular [dependencies] above — no [dev-dependencies] needed.
