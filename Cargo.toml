# mybox workspace
#
# Cargo workspace for the mybox modular desktop toolbox.
# See .planning/phases/01-framework/01-RESEARCH.md §3 for the crate layout rationale.

[workspace]
members = ["crates/mybox-core", "crates/mybox-app", "crates/modules/test", "crates/modules/capture"]
resolver = "2"

# Version-locked per RESEARCH §1 (verified 2026-08 against crates.io sources).
# Do NOT bump any of these without re-verifying cross-compatibility.
[workspace.dependencies]
winit = "0.30.13"
tiny-skia = "0.12.0"
softbuffer = "0.4.8"
global-hotkey = "0.8.0"
tray-icon = "0.24.2"
muda = "0.19.3"
crossbeam-channel = "0.5.16"
serde = "1"
serde_json = "1"
toml = "1.1.4"
directories = "6.0.0"
parking_lot = "0.12.5"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
xcap = "0.9.8"
arboard = "3.6.1"
ab_glyph = "0.2.32"
# Phase 3 (03-RESEARCH Package Legitimacy Audit — all [OK], versions verified
# against the crates.io sparse index + downloaded sources 2026-08-14).
egui = "0.30.0"          # D-02 lock: 0.30.0 is the ONLY 0.30.x release
egui-winit = "0.30.0"    # declares winit 0.30.5 → resolves to pinned 0.30.13
fuzzy-matcher = "0.3.7"
pollster = "1.0.1"
objc2-app-kit = "0.3.2"  # already in lock (via winit/xcap) — promoted to direct macOS dep
